spring.datasource.url=jdbc:h2:mem:collabix_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.test.context=warn

app.jwt.secret=test-secret-that-is-at-least-thirty-two-characters-long-for-hs256
app.jwt.issuer=collabix-test
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.security.csp.connect-src=http://localhost:5173
