spring.application.name=backend
server.port=${PORT:8081}

# ==========================
# Actuator
# ==========================
management.endpoint.health.show-details=always
management.health.mail.enabled=true

# ==========================
# .env file support
# ==========================
spring.config.import=optional:file:.env[.properties]

# ==========================
# PostgreSQL
# ==========================
# Production (Railway): set SPRING_DATASOURCE_URL to a JDBC URL, e.g.
#   jdbc:postgresql://host:5432/db
# Railway's injected DATABASE_URL uses the "postgresql://" scheme; prefix it
# with "jdbc:" in a dedicated SPRING_DATASOURCE_URL variable.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/collabix_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:collabix_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Collabix@2026}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
# show-sql and format_sql are set in application-dev.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================
# Flyway
# ==========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

springdoc.api-docs.path=/v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui

# ==========================
# JWT Configuration
# ==========================

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=collabix
app.jwt.access-token-expiration=18000000
app.jwt.refresh-token-expiration=604800000

# ==========================
# CORS (merged with localhost defaults in SecurityConfig)
# ==========================
# Comma-separated list of allowed origins for production,
# e.g. https://collabix.vercel.app
# Fallback covers both the Vercel frontend and the Railway-served frontend
# when CORS_ORIGIN is unset.
app.cors.allowed-origins=${CORS_ORIGIN:https://collabix-chi.vercel.app,https://collabix-production-eead.up.railway.app}

# ==========================
# CSP connect-src (SecurityConfig)
# ==========================
# Space-separated list of origins allowed to connect to the API
# (added to connect-src 'self'). e.g.
#   https://collabix-chi.vercel.app https://collabix-production-eead.up.railway.app
app.security.csp.connect-src=${CSP_CONNECT_SRC:http://localhost:5173}

# ==========================
# WebSocket Allowed Origins
# ==========================
# Comma-separated. Defaults cover local dev + deployed frontends.
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.collabix.app,https://*.vercel.app,https://collabix-production-eead.up.railway.app}



# ==========================
# Spring Mail (SMTP) — Brevo relay via SMTPS (implicit SSL) on port 465
# ==========================
# Default: Brevo (smtp-relay.brevo.com). Override via env vars to switch
# provider, e.g. Gmail (MAIL_HOST=smtp.gmail.com) or STARTTLS on 587
# (MAIL_PORT=587, MAIL_SSL_ENABLE=false, MAIL_STARTTLS_ENABLE=true).
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:465}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

# Timeouts (ms) — prevents the Actuator MailHealthIndicator from hanging.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# SMTP authentication
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

# STARTTLS — disabled (implicit SSL used instead)
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

# SSL — enabled by default (implicit SSL on port 465)
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}

# ==========================
# Custom Mail Properties
# ==========================
app.mail.from=${MAIL_FROM_ADDRESS:noreply@collabix.app}
app.mail.from-name=${MAIL_FROM_NAME:Collabix}
# When BREVO_API_KEY is set, emails are sent via the Brevo HTTP API (443),
# bypassing SMTP entirely (avoids egress SMTP restrictions on some hosts).
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Frontend URL used in account-activation links.
app.activation.base-url=${ACTIVATION_BASE_URL:http://localhost:5173}

# ==========================
# Debug / Logging — moved to application-dev.properties
# ==========================
logging.level.org.springframework=INFO
logging.level.com.trio.backend=INFO

# ==========================
# Swagger / OpenAPI
# ==========================
# Swagger is enabled by default. Disable in production by setting:
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false


# ==========================
# Login Security (Brute-Force Protection)
# ==========================
app.storage.local.path=${STORAGE_PATH:./uploads}
app.storage.max-file-size=${MAX_FILE_SIZE:10485760}

# ==========================
# File Upload (Spring MVC)
# ==========================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE_MB:10MB}

# ==========================
# Dashboard
# ==========================
app.dashboard.recent-limit=${DASHBOARD_RECENT_LIMIT:10}

# ==========================
# AI Configuration
# ==========================
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
ai.groq.url=${GROQ_URL:https://api.groq.com}

app.login-security.max-attempts=5
app.login-security.lock-duration=30m
app.login-security.automatic-unlock-enabled=true
app.login-security.enabled=true
